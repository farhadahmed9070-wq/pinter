name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1
          echo "JAVA_HOME=${JAVA_HOME:-}"

          RAW_VERSION="$(java -version 2>&1 | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          MAJOR_VERSION="${RAW_VERSION%%.*}"
          if [ "$MAJOR_VERSION" = "1" ]; then
            REMAINDER="${RAW_VERSION#1.}"
            MAJOR_VERSION="${REMAINDER%%.*}"
          fi
          MAJOR_VERSION="${MAJOR_VERSION%%[!0-9]*}"

          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -ge 17 ] 2>/dev/null; then
            echo "::error::Java 17 or newer is required, but detected version '${RAW_VERSION}'."
            exit 1
          fi

          echo "Active Java major version verified: ${MAJOR_VERSION}"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          DETECTED_GRADLE="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          if [ "$DETECTED_GRADLE" != "9.3.1" ]; then
            echo "::error::Expected Gradle 9.3.1, but detected '${DETECTED_GRADLE:-unknown}'."
            exit 1
          fi
          echo "Active Gradle version verified: ${DETECTED_GRADLE}"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists at ./debug.keystore."
          else
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build Debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected Debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have a .apk extension."
            exit 1
          fi

          echo "Verified Debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          STAGING_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-asset.XXXXXX")"
          DEST_APK="${STAGING_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ] || [[ "$DEST_APK" != *.apk ]]; then
            echo "::error::Failed to prepare valid release APK asset."
            exit 1
          fi

          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release APK asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -e "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release APK asset validation failed before publishing."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes.XXXXXX.md")"

          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated Debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`

          This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "## Debug APK Build & GitHub Release Summary"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **GitHub Release:** Published"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "Download the APK directly from the **Release Assets** section on the release page above. The Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the Debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build Summary"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` (available for download)"
              echo "- **GitHub Release:** Failed (see warning in step logs)"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed, so no Release URL was created. You can still download the built Debug APK from the \`app-debug-apk\` artifact on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
